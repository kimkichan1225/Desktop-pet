// 스프라이트를 캔버스에 그리기
function drawSprite(canvas, grid, scale) {
  const rows = grid.length;
  const cols = grid[0].length;
  canvas.width = cols;
  canvas.height = rows + 2; // 바운스 여유 공간
  canvas.style.width = cols * scale + 'px';
  canvas.style.height = (rows + 2) * scale + 'px';
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, cols, rows + 2);
  for(let y = 0; y < rows; y++){
    for(let x = 0; x < cols; x++){
      const c = grid[y][x];
      if(c[0] > 240 && c[1] > 240 && c[2] > 240) continue;
      if(c[0] === 0 && c[1] === 0 && c[2] === 0) continue;
      ctx.fillStyle = `rgb(${c[0]},${c[1]},${c[2]})`;
      ctx.fillRect(x, y, 1, 1);
    }
  }
}

const idleCvs = document.getElementById('anim-idle');
const moveCvs = document.getElementById('anim-move');
const eatCvs = document.getElementById('anim-eat');
const happyCvs = document.getElementById('anim-happy');
const sleepCvs = document.getElementById('anim-sleep');
let tick = 0;

// 스프라이트 변형: 행 복제/삭제로 세로 늘리기/줄이기, 열 복제/삭제로 가로
function transformGrid(grid, stretchY, stretchX) {
  // stretchY: 양수=행 복제(늘림), 음수=행 삭제(줄임)
  // stretchX: 양수=열 복제(늘림), 음수=열 삭제(줄임)
  let result = grid.map(row => [...row]);

  // 세로 변형
  if(stretchY > 0) {
    // 중간 행 복제
    for(let i = 0; i < stretchY; i++){
      const mid = Math.floor(result.length * 0.4) + i;
      result.splice(mid, 0, [...result[mid]]);
    }
  } else if(stretchY < 0) {
    // 중간 행 삭제
    for(let i = 0; i < -stretchY; i++){
      const mid = Math.floor(result.length * 0.4);
      if(result.length > 5) result.splice(mid, 1);
    }
  }

  // 가로 변형
  if(stretchX !== 0) {
    result = result.map(row => {
      let r = [...row];
      if(stretchX > 0) {
        // 중간 열 복제
        for(let i = 0; i < stretchX; i++){
          const mid = Math.floor(r.length / 2);
          r.splice(mid, 0, r[mid]);
        }
      } else {
        // 중간 열 삭제
        for(let i = 0; i < -stretchX; i++){
          const mid = Math.floor(r.length / 2);
          if(r.length > 5) r.splice(mid, 1);
        }
      }
      return r;
    });
  }
  return result;
}

function drawGrid(ctx, grid, ox, oy) {
  for(let y = 0; y < grid.length; y++){
    for(let x = 0; x < grid[y].length; x++){
      const c = grid[y][x];
      if((c[0]>240&&c[1]>240&&c[2]>240)||(c[0]===0&&c[1]===0&&c[2]===0)) continue;
      ctx.fillStyle = `rgb(${c[0]},${c[1]},${c[2]})`;
      ctx.fillRect(x + ox, y + oy, 1, 1);
    }
  }
}

// ===== 대기 애니메이션: 제자리 말랑말랑 =====
function animIdleLoop() {
  tick++;
  const rows = G.length;
  const cols = G[0].length;

  // 4단계 부드러운 말랑 (각 15프레임)
  const frame = Math.floor(tick / 15) % 4;

  const W = cols + 4, H = rows + 4;
  idleCvs.width = W;
  idleCvs.height = H;
  idleCvs.style.width = W * 5 + 'px';
  idleCvs.style.height = H * 5 + 'px';
  const ctx = idleCvs.getContext('2d');
  ctx.clearRect(0, 0, W, H);

  let grid, ox = 2, oy = 2;

  if(frame === 0) {
    grid = G;
  } else if(frame === 1) {
    // 살짝 세로로 늘어남
    grid = transformGrid(G, 1, 0);
    oy = 1;
  } else if(frame === 2) {
    grid = G;
  } else {
    // 살짝 가로로 넓어짐
    grid = transformGrid(G, -1, 1);
    ox = 1; oy = 3;
  }

  drawGrid(ctx, grid, ox, oy);

  // ===== 이동 애니메이션: 도잉도잉 점프 =====
  const mframe = Math.floor(tick / 11) % 6;

  const MW = cols + 6, MH = rows + 10;
  moveCvs.width = MW;
  moveCvs.height = MH;
  moveCvs.style.width = MW * 5 + 'px';
  moveCvs.style.height = MH * 5 + 'px';
  const mctx = moveCvs.getContext('2d');
  mctx.clearRect(0, 0, MW, MH);

  let mgrid, mox = 3, moy = 5;

  if(mframe === 0) {
    mgrid = G;
  } else if(mframe === 1) {
    mgrid = transformGrid(G, 2, -2);
    mox = 4; moy = 3;
  } else if(mframe === 2) {
    mgrid = G;
    moy = 2;
  } else if(mframe === 3) {
    mgrid = G;
    moy = 4;
  } else if(mframe === 4) {
    mgrid = transformGrid(G, -2, 2);
    mox = 2; moy = 7;
  } else {
    mgrid = transformGrid(G, 1, 0);
    moy = 4;
  }

  drawGrid(mctx, mgrid, mox, moy);

  // ===== 먹기 애니메이션: 냠냠 =====
  const eframe = Math.floor(tick / 9) % 6;
  const EW = cols + 4, EH = rows + 4;
  eatCvs.width = EW; eatCvs.height = EH;
  eatCvs.style.width = EW*5+'px'; eatCvs.style.height = EH*5+'px';
  const ectx = eatCvs.getContext('2d');
  ectx.clearRect(0,0,EW,EH);

  let egrid, eox=2, eoy=2;
  if(eframe===0) {
    egrid = G_EAT; // 입 벌린 상태
  } else if(eframe===1) {
    egrid = transformGrid(G_EAT, -1, 1); // 냠 준비
    eox=1; eoy=3;
  } else if(eframe===2) {
    egrid = transformGrid(G, 1, -1); // 냠! (입 닫고 세로로)
    eox=3; eoy=1;
  } else if(eframe===3) {
    egrid = G_EAT; // 다시 벌림
  } else if(eframe===4) {
    egrid = transformGrid(G_EAT, -1, 1);
    eox=1; eoy=3;
  } else {
    egrid = transformGrid(G, 1, -1); // 냠!
    eox=3; eoy=1;
  }
  drawGrid(ectx, egrid, eox, eoy);

  // ===== 기쁨 애니메이션: 점프 + 좌우 흔들기 =====
  const hframe = Math.floor(tick / 7) % 8;
  const HW = cols + 6, HH = rows + 8;
  happyCvs.width = HW; happyCvs.height = HH;
  happyCvs.style.width = HW*5+'px'; happyCvs.style.height = HH*5+'px';
  const hctx = happyCvs.getContext('2d');
  hctx.clearRect(0,0,HW,HH);

  let hgrid=G, hox=3, hoy=4;
  if(hframe===0) {
    hoy=4; // 원위치
  } else if(hframe===1) {
    hgrid = transformGrid(G, 2, -1);
    hox=3; hoy=2; // 늘어남
  } else if(hframe===2) {
    hoy=1; hox=2; // 점프+왼쪽
  } else if(hframe===3) {
    hoy=1; hox=4; // 점프+오른쪽
  } else if(hframe===4) {
    hoy=1; hox=2; // 점프+왼쪽
  } else if(hframe===5) {
    hoy=1; hox=4; // 점프+오른쪽
  } else if(hframe===6) {
    hoy=3; // 내려옴
  } else {
    hgrid = transformGrid(G, -1, 1);
    hox=2; hoy=5; // 착지 찌그러짐
  }
  drawGrid(hctx, hgrid, hox, hoy);

  // ===== 잠자기 애니메이션: 천천히 위아래 + 기울어짐 =====
  const sframe = Math.floor(tick / 20) % 4;
  const SW = cols + 6, SH = rows + 4;
  sleepCvs.width = SW; sleepCvs.height = SH;
  sleepCvs.style.width = SW*5+'px'; sleepCvs.style.height = SH*5+'px';
  const sctx = sleepCvs.getContext('2d');
  sctx.clearRect(0,0,SW,SH);

  // 기울어짐: 각 행을 옆으로 1px 밀기
  let sgrid = G_SLEEP.map(r=>[...r]);
  let sox=3, soy=2;

  if(sframe===0) {
    sgrid = G_SLEEP;
    soy=2;
  } else if(sframe===1) {
    soy=1;
    sgrid = G_SLEEP.map((r,i)=>{
      const shift = Math.round((1 - i/G_SLEEP.length) * 1);
      const nr = new Array(r.length).fill([0,0,0]);
      for(let x=0;x<r.length;x++){
        const nx = x + shift;
        if(nx>=0 && nx<r.length) nr[nx] = r[x];
      }
      return nr;
    });
    sox=2;
  } else if(sframe===2) {
    sgrid = G_SLEEP;
    soy=2;
  } else {
    soy=3;
    sgrid = G_SLEEP.map((r,i)=>{
      const shift = -Math.round((1 - i/G_SLEEP.length) * 1);
      const nr = new Array(r.length).fill([0,0,0]);
      for(let x=0;x<r.length;x++){
        const nx = x + shift;
        if(nx>=0 && nx<r.length) nr[nx] = r[x];
      }
      return nr;
    });
    sox=4;
  }
  drawGrid(sctx, sgrid, sox, soy);

  // Zzz 텍스트
  sctx.fillStyle = '#aaa';
  sctx.font = '4px sans-serif';
  const zt = Math.floor(tick/30) % 3;
  if(zt>=0) sctx.fillText('z', SW-5, 5);
  if(zt>=1) sctx.fillText('z', SW-3, 3);
  if(zt>=2) sctx.fillText('Z', SW-2, 1);

  requestAnimationFrame(animIdleLoop);
}

animIdleLoop();
</script>
